<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-300 h-[2000px]"> <!-- height for scroll -->

<!-- NAVBAR -->
<div class="relative bg-black text-white overflow-hidden sticky top-0 z-50">

  <!-- NAV CONTENT -->
  <div class="flex justify-between items-center px-12 py-5 text-sm font-semibold">
    <h1 class="text-2xl font-bold">nanamama!</h1>

    <ul class="flex gap-8">
      <li>PRODUCTS</li>
      <li>GIFTING</li>
      <li>ABOUT US</li>
      <li>JOURNAL</li>
    </ul>
  </div>

  <!-- CURVE -->
  <svg 
    class="absolute bottom-0 left-0 w-full h-20"
    viewBox="0 0 1440 120"
    preserveAspectRatio="none"
  >
    <path 
      fill="#d1d5db"
      d="M0,80 C300,120 900,40 1440,100 L1440,120 L0,120 Z">
    </path>
  </svg>

</div>

<!-- PAGE CONTENT -->
<div class="p-10">
  <p class="text-xl">Scroll down... Navbar will stay fixed 🔥</p>
</div>

</body>

</html>
